<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalendar & Cuaca Malaysia 2026</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col p-4 space-y-6">

    <header class="glass-panel p-4 rounded-2xl flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-amber-500 to-red-600 p-3 rounded-2xl text-white">
                <i class="fa-solid fa-calendar-days text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Kalendar Malaysia <span class="text-xs bg-red-600 px-2 py-0.5 rounded-full">2026</span></h1>
                <p class="text-xs text-slate-400">Cuti Perayaan • Waktu Solat • Cuaca</p>
            </div>
        </div>
    </header>

    <main class="space-y-6">
        <section class="glass-panel p-6 rounded-3xl bg-blue-600/30 border border-blue-400/30 flex justify-between items-center">
            <div>
                <p class="text-xs text-blue-200 uppercase font-semibold">Laporan Cuaca</p>
                <h2 class="text-2xl font-bold text-white">Kuala Lumpur</h2>
                <p class="text-sm text-blue-100">Hujan / Berawan</p>
            </div>
            <div class="text-right">
                <span class="text-5xl font-black text-white">31°C</span>
            </div>
        </section>

        <section class="glass-panel p-6 rounded-3xl space-y-3">
            <h3 class="text-md font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-mosque"></i> Waktu Solat
            </h3>
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                <div class="bg-slate-800 p-2 rounded-xl"><p class="text-slate-400">Subuh</p><p class="font-bold text-emerald-400">05:52</p></div>
                <div class="bg-slate-800 p-2 rounded-xl"><p class="text-slate-400">Zohor</p><p class="font-bold">13:20</p></div>
                <div class="bg-slate-800 p-2 rounded-xl"><p class="text-slate-400">Maghrib</p><p class="font-bold text-amber-400">19:30</p></div>
            </div>
        </section>
    </main>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
